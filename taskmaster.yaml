# Taskmaster demo configuration.
# Relative paths are relative to THIS file's directory.

taskmaster:
  logfile: ./logs/taskmaster.log      # event log (mandatory logging)
  socket: /tmp/taskmaster.sock        # UNIX socket used by taskmasterctl (bonus)
  http_alert: http://127.0.0.1:8080/alert          # bonus: POST alerts (programs/webhook_server.py)

programs:
  # Every option, on a simple long-running program
  ticker:
    cmd: "programs/ticker.py tick"    # command to launch
    numprocs: 2                        # number of processes to keep alive (ticker:0, ticker:1)
    user: maro
    umask: 022                         # umask before exec
    workingdir: /tmp                   # cwd before exec
    autostart: true                    # start when taskmaster starts
    autorestart: unexpected            # always | never | unexpected
    exitcodes: [0, 2]                  # "expected" exit codes
    startretries: 3                    # restart attempts before FATAL
    starttime: 2                       # seconds alive to be "successfully started"
    stopsignal: TERM                   # graceful stop signal
    stoptime: 5                        # seconds before SIGKILL after a graceful stop
    stdout: ./logs/ticker.stdout       # redirect stdout to a file
    stderr: ./logs/ticker.stderr       # redirect stderr to a file
    env:                               # extra environment variables
      STARTED_BY: taskmaster
      ANSWER: 42

  # Can only fail -> BACKOFF x3 -> FATAL
  crasher:
    cmd: "programs/crasher.py"
    autostart: true
    autorestart: unexpected
    startretries: 3
    starttime: 1
    stderr: ./logs/crasher.stderr
    stdout: ./logs/crasher.stdout       # redirect stdout to a file


  # Exits with code 2 after 4s. 2 is NOT in exitcodes -> unexpected -> restarted.
  # Change exitcodes to [0, 2] and reload: it stays EXITED.
  # Change autorestart to always/never to see the difference.
  exiter:
    cmd: "programs/exit_with.py 2 4"
    autostart: false
    autorestart: unexpected
    exitcodes: [0]
    starttime: 1
    stdout: ./logs/exiter.stdout

  # Ignores SIGTERM. With stopsignal TERM it is SIGKILLed after stoptime (3s).
  # Change stopsignal to USR1 and reload: it stops gracefully at once.
  stubborn:
    cmd: "programs/stubborn.py"
    autostart: true
    stopsignal: TERM
    stoptime: 3
    stdout: ./logs/stubborn.stdout

  # Shows env, workingdir and umask in its stdout
  showenv:
    cmd: "programs/show_env.py"
    autostart: true
    workingdir: /tmp
    umask: 077
    env:
      STARTED_BY: taskmaster
      ANSWER: 42
      GREETING: "hello from the configSSS"
    stdout: ./logs/showenv.stdout
    stderr: ./logs/showenv.stderr

  # Huge output, everything discarded (stress test)
  flood:
    cmd: "programs/flood.py"
    autostart: false
    stdout: discard
    stderr: discard

  # Interactive program for the 'attach' bonus
  echo:
    cmd: "programs/echo_repl.py"
    autostart: true
    autorestart: always
    stdout: ./logs/echo.stdout

# =============================================================================
# REFERENCE: every option this file accepts
# =============================================================================
#
# taskmaster:                  # optional section: settings of taskmaster itself
#   logfile: PATH              # event log                     (default /tmp/taskmaster.log)
#   socket: PATH               # control socket, keep it short (default /tmp/taskmaster.sock)
#   http_alert: URL            # bonus: POST a JSON alert on FATAL / unexpected exit
#
# programs:                    # required section
#   NAME:                      # program name, no ':' (numprocs > 1 -> NAME:0, NAME:1 ...)
#     cmd: "COMMAND ARGS"      # REQUIRED. Split like a shell, but no shell is used:
#                              #   use "sh -c '...'" for pipes, &&, redirections.
#                              #   A relative path ("programs/x.py") is relative to this file.
#     numprocs: N              # copies to start and keep running, >= 1          (default 1)
#     autostart: true|false    # start when taskmaster starts / when reload adds it (default true)
#     autorestart: VALUE       # what to do when it dies by itself while RUNNING (default unexpected)
#                              #   always     -> always restart
#                              #   never      -> never restart
#                              #   unexpected -> restart only if the exit code is not in exitcodes
#                              #                 (a death by signal is always unexpected)
#     exitcodes: CODE | [CODES]  # "expected" exit codes, 0-255                    (default [0])
#     starttime: SECONDS       # must stay alive this long to be "successfully started" (default 1)
#     startretries: N          # failed starts (death before starttime) allowed before FATAL (default 3)
#     stopsignal: SIGNAL       # graceful stop signal: TERM INT QUIT HUP KILL USR1 USR2 ...
#                              #   ("SIG" prefix allowed)                          (default TERM)
#     stoptime: SECONDS        # wait after stopsignal before SIGKILL              (default 10)
#     stdout: PATH | discard   # where its stdout goes (appended)                  (default discard)
#     stderr: PATH | discard   # where its stderr goes (appended)                  (default discard)
#     env:                     # extra environment variables (added to taskmaster's environment)
#       NAME: value
#     workingdir: PATH         # directory to chdir into before starting          (default: inherited)
#     umask: 0NNN              # octal, ALWAYS with a leading 0 (022, 077)         (default: inherited)
#     user: USERNAME           # bonus: run as this user (taskmaster must be started as root)
#
# Apply changes while running: "reload" in the shell, or  kill -HUP <taskmaster pid>
# Only programs whose options changed are restarted.
