# Bonus demo configuration (used by "make bonus").
# Every bonus is already enabled here: nothing to uncomment.
# Relative paths are relative to THIS file's directory.

taskmaster:
  logfile: ./logs/taskmaster.log
  socket: /tmp/taskmaster.sock
  http_alert: http://127.0.0.1:8080/alert        # bonus: received by programs/webhook_server.py

programs:
  # kill -9 one of them -> "UNEXPECTED_EXIT" alert, then restarted
  ticker:
    cmd: "programs/ticker.py tick"
    numprocs: 2
    starttime: 2
    stdout: ./logs/ticker.stdout

  # "start crasher" -> BACKOFF x3 -> FATAL -> "FATAL" alert (HTTP)
  crasher:
    cmd: "programs/crasher.py"
    autostart: false
    startretries: 3
    stderr: ./logs/crasher.stderr

  # attach bonus: "attach echo", type something, Ctrl-D to detach
  echo:
    cmd: "programs/echo_repl.py"
    autorestart: always
    stdout: ./logs/echo.stdout
